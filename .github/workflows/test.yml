# プルリクエスト時に自動テストを実行するワークフロー
name: CI - テスト実行

on:
  pull_request:
    branches: [main]

jobs:
  # バックエンドの単体テスト
  backend-test:
    name: バックエンド テスト (JUnit 5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17 セットアップ
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Maven ビルドとテスト実行
        run: cd backend && mvn test

      - name: テストレポートのアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-report
          path: backend/target/surefire-reports/

  # フロントエンドの単体テスト
  frontend-test:
    name: フロントエンド テスト (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js 20 セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 依存関係のインストール
        run: cd frontend && npm ci

      - name: Vitest 単体テスト実行
        run: cd frontend && npm test

      - name: テストレポートのアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-vitest-report
          path: frontend/coverage/

  # E2Eテスト（バックエンドとフロントエンドを起動して実行）
  e2e-test:
    name: E2E テスト (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17 セットアップ
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Node.js 20 セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: バックエンド ビルド（JARファイル作成）
        run: cd backend && mvn package -q -DskipTests

      - name: フロントエンド 依存関係インストール
        run: cd frontend && npm ci

      - name: Playwright ブラウザ インストール
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Playwright E2Eテスト実行
        run: cd frontend && npx playwright test

      - name: テストレポートのアップロード（失敗時のみ）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
