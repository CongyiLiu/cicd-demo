# プルリクエスト時に自動テストを実行するワークフロー
name: CI - テスト実行

on:
  pull_request:
    branches: [main]

jobs:
  # バックエンドの単体テスト
  backend-test:
    name: バックエンド テスト (JUnit 5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17 セットアップ
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Maven ビルドとテスト実行
        run: cd backend && mvn test -Dmaven.surefire.report.plugins=org.apache.maven.plugins:maven-surefire-report-plugin

      - name: テストレポートのアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-report
          path: backend/target/surefire-reports/

      - name: テスト結果を発行
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: バックエンド テスト結果
          path: 'backend/target/surefire-reports/*.xml'
          reporter: 'java-junit'

  # フロントエンドの単体テスト
  frontend-test:
    name: フロントエンド テスト (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js 20 セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 依存関係のインストール
        run: cd frontend && npm ci

      - name: Vitest 単体テスト実行
        run: cd frontend && npm test -- --reporter=verbose

      - name: Vitest HTML レポート生成
        if: always()
        run: cd frontend && npm test -- --reporter=html --outputFile=vitest-report.html

      - name: テストレポートのアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-vitest-report
          path: |
            frontend/vitest-report.html
            frontend/coverage/

  # E2Eテスト（バックエンドとフロントエンドを起動して実行）
  e2e-test:
    name: E2E テスト (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17 セットアップ
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Node.js 20 セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: バックエンド ビルド（JARファイル作成）
        run: cd backend && mvn package -q -DskipTests

      - name: フロントエンド 依存関係インストール
        run: cd frontend && npm ci

      - name: Playwright ブラウザ インストール
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Playwright E2Eテスト実行
        run: cd frontend && npx playwright test

      - name: テストレポートのアップロード（失敗時のみ）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/

      - name: E2Eテスト結果を発行
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: E2E テスト結果 (Playwright)
          path: 'frontend/playwright-report/results.json'
          reporter: 'jest-junit'
          fail-on-error: false

  # テスト結果サマリーをPRコメントに投稿
  test-summary:
    name: テスト結果サマリー
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, e2e-test]
    if: always()
    steps:
      - name: テスト結果をPRコメントに投稿
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const backend = ${{ needs.backend-test.result == 'success' }};
            const frontend = ${{ needs.frontend-test.result == 'success' }};
            const e2e = ${{ needs.e2e-test.result == 'success' }};

            const status = backend && frontend && e2e ? '✅ すべてのテストが合格しました' : '❌ テストが失敗しました';
            
            const comment = `## テスト実行結果

${status}

| テスト項目 | 状態 |
|---------|------|
| バックエンド (JUnit 5) | ${backend ? '✅ 合格' : '❌ 失敗'} |
| フロントエンド (Vitest) | ${frontend ? '✅ 合格' : '❌ 失敗'} |
| E2E (Playwright) | ${e2e ? '✅ 合格' : '❌ 失敗'} |

> 詳細なテストレポートは **Artifacts** タブでダウンロードできます`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
